<!DOCTYPE html>
<html>
    <head>
        <title> calculatrice</title>
        <meta charset="utf-8">
        <link href="calco.css"  rel="stylesheet">
    </head>
    <body>
        <div class="calculatrice">
            <div>
                <input type="text" id="afficheur" readonly>
            </div>
                <button class="effacer">&#9003</button>
            
            <div class="buttons">
                <button class="chiffre">1</button>
                <button class="chiffre">2</button>
                <button class="chiffre">3</button>
                <button class="operateur">+</button>
                <button class="chiffre">4</button>
                <button class="chiffre">5</button>
                <button class="chiffre">6</button>
                <button class="operateur">-</button>
                <button class="chiffre">7</button>
                <button class="chiffre">8</button>
                <button class="chiffre">9</button>
                <button class="operateur">*</button>
                <button class="chiffre">0</button>
                <button class="decimal">.</button>
                <button class="cancel">c</button>
                <button class="operateur">/</button>
                <button class="egal">=</button>
            </div>
        </div>
        <script src="calco.js"></script>
    </body>
</html>
